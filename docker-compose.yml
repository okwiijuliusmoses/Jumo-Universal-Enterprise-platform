# JUMO UEOS Docker Compose Orchestration Setup
services:
  ueos-kernel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jumo-ueos-kernel
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: always
    volumes:
      - ueos-data:/usr/src/app/assets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ueos/security/identity').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ueos-data:
    driver: local
